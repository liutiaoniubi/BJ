name: Build iOS Tweak (iOS 16 / RootHide)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    # macos-14 自带 Xcode 14/15，能拿到 iOS 16 SDK
    runs-on: macos-14

    steps:
    - uses: actions/checkout@v4

    - name: 环境诊断（看用哪个 Xcode / SDK）
      run: |
        echo "=== macOS ==="; sw_vers
        echo "=== 已安装 Xcode ==="
        ls -d /Applications/Xcode*.app 2>/dev/null || echo "(无)"
        echo "=== 当前 SDK ==="
        xcrun --sdk iphoneos --show-sdk-version || true

    - name: 优先选用 iOS 16 SDK 的 Xcode
      id: sdk
      run: |
        BEST=""
        BESTVER=""
        for app in /Applications/Xcode*.app; do
          [ -d "$app" ] || continue
          SDKDIR="$app/Contents/Developer/Platforms/iPhoneOS.platform/Developer/SDKs"
          [ -d "$SDKDIR" ] || continue
          VER=$(ls "$SDKDIR" 2>/dev/null | grep -oE 'iPhoneOS[0-9]+\.sdk' | grep -oE '[0-9]+' | sort -n | tail -1)
          echo "发现: $app -> iPhoneOS $VER"
          if [ -n "$VER" ] && [ "$VER" -le 17 ] 2>/dev/null; then
            BEST="$app"; BESTVER="$VER"
          fi
        done
        if [ -n "$BEST" ]; then
          echo "选用 $BEST (SDK $BESTVER)"
          sudo xcode-select -s "$BEST/Contents/Developer"
        else
          echo "未找到 iOS 16 SDK，使用默认 Xcode"
        fi
        SDK=$(xcrun --sdk iphoneos --show-sdk-version)
        SYSROOT=$(xcrun --sdk iphoneos --show-sdk-path)
        echo "最终 SDK=$SDK"
        echo "SYSROOT=$SYSROOT"
        echo "sdk=$SDK" >> $GITHUB_OUTPUT
        echo "sysroot=$SYSROOT" >> $GITHUB_OUTPUT

    - name: 安装 roothide 版 Theos（纯 clone，不走 install-theos）
      run: |
        set -e
        # 关键：先彻底删干净，避免 "already exists"
        rm -rf "$HOME/theos"
        export THEOS_NO_SDK_DOWNLOAD=1
        git clone --recursive --depth 1 https://github.com/roothide/theos.git "$HOME/theos"
        test -f "$HOME/theos/bin/nic.pl" && echo "Theos 就位"

    - name: 安装 ldid（签名工具）
      run: |
        set -e
        if [ -x "$HOME/theos/bin/ldid" ]; then
          echo "Theos 自带 ldid"; exit 0
        fi
        if command -v ldid >/dev/null 2>&1; then
          echo "系统已有 ldid"; exit 0
        fi
        if brew install ldid 2>/dev/null; then
          command -v ldid; exit 0
        fi
        if [ "$(uname -m)" = "arm64" ]; then BIN=ldid_macosx_arm64; else BIN=ldid_macosx_x86_64; fi
        curl -fsSL -o /tmp/ldid "https://github.com/ProcursusTeam/ldid/releases/download/v2.1.5-procursus7/$BIN"
        chmod +x /tmp/ldid
        sudo mv /tmp/ldid /usr/local/bin/ldid
        ldid --version || true

    - name: 设置隐根架构
      run: |
        perl -i -pe 's/^Architecture:.*/Architecture: iphoneos-arm64e/' control
        grep '^Architecture:' control
        echo "--- 仓库文件 ---"; ls -la

    - name: 编译
      run: |
        export THEOS="$HOME/theos"
        export PATH="$THEOS/bin:/usr/local/bin:$PATH"
        export THEOS_NO_SDK_DOWNLOAD=1
        SDK="${{ steps.sdk.outputs.sdk }}"
        SYSROOT="${{ steps.sdk.outputs.sysroot }}"
        echo "编译参数: SDK=$SDK SYSROOT=$SYSROOT"
        make package \
          THEOS_PACKAGE_SCHEME=roothide \
          TARGET="iphone:clang:$SDK:16.5" \
          SYSROOT="$SYSROOT" 2>&1 | tee build.log
        exit ${PIPESTATUS[0]}

    - name: 验证 dylib 架构与 ABI
      if: always()
      run: |
        DYLIB=$(find .theos -name "NoTodayEditBtn.dylib" | head -1)
        echo "dylib: $DYLIB"
        [ -f "$DYLIB" ] || { echo "!!! 没找到 dylib"; exit 0; }
        echo "=== file ==="; file "$DYLIB"
        echo "=== 架构 ==="; otool -hv "$DYLIB" 2>/dev/null | head -8
        echo "=== 最低系统版本 ==="
        otool -l "$DYLIB" 2>/dev/null | grep -A4 LC_BUILD_VERSION | grep -E "minos|platform"
        echo "=== 依赖库 ==="; otool -L "$DYLIB" 2>/dev/null | head -10
        echo "=== 签名 ==="; ldid -e "$DYLIB" 2>/dev/null | head -5 || echo "(无签名信息)"

    - name: 查看 deb 信息
      if: always()
      run: |
        ls -la packages/ 2>/dev/null || echo "packages 目录不存在"
        for f in packages/*.deb; do
          [ -e "$f" ] || continue
          echo "--- $f ---"
          ar -p "$f" control.tar.* 2>/dev/null | tar -xzO ./control 2>/dev/null | grep -E '^(Package|Architecture|Version)'
        done

    - name: 上传编译日志
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: build.log
        if-no-files-found: warn

    - name: 上传 deb
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: NoTodayEditBtn-deb
        path: packages/*.deb
        if-no-files-found: error
