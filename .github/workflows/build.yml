name: Build iOS Tweak

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4

    - name: 环境信息
      run: |
        sw_vers
        xcrun --sdk iphoneos --show-sdk-version
        ls "$(xcrun --sdk iphoneos --show-sdk-path)/usr/lib" | head -3

    - name: 安装 roothide 版 Theos（跳过 SDK 下载）
      run: |
        set -e
        # 关键：先删干净，避免 "destination path already exists"
        rm -rf "$HOME/theos"
        # THEOS 不自动下载 SDK，我们用 Xcode 自带的
        export THEOS_NO_SDK_DOWNLOAD=1
        git clone --recursive --depth 1 https://github.com/roothide/theos.git "$HOME/theos"
        ls "$HOME/theos/bin/nic.pl" && echo "theos 就位"

    - name: 设置隐根架构
      run: |
        perl -i -pe 's/^Architecture:.*/Architecture: iphoneos-arm64e/' control
        grep '^Architecture:' control

    - name: 编译
      run: |
        export THEOS="$HOME/theos"
        export PATH="$THEOS/bin:$PATH"
        export THEOS_NO_SDK_DOWNLOAD=1
        SDK=$(xcrun --sdk iphoneos --show-sdk-version)
        SYSROOT=$(xcrun --sdk iphoneos --show-sdk-path)
        echo "SDK=$SDK"
        echo "SYSROOT=$SYSROOT"
        make package \
          THEOS_PACKAGE_SCHEME=roothide \
          TARGET="iphone:clang:$SDK:14.0" \
          SYSROOT="$SYSROOT" 2>&1 | tee build.log
        exit ${PIPESTATUS[0]}

    - name: 查看 deb 架构
      if: always()
      run: |
        ls -la packages/ 2>/dev/null || echo "packages 目录不存在"
        for f in packages/*.deb; do
          [ -e "$f" ] || continue
          echo "--- $f ---"
          ar -p "$f" control.tar.* 2>/dev/null | tar -xzO ./control 2>/dev/null | grep -E '^(Package|Architecture|Version)' || true
        done

    - name: 上传编译日志
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: build.log
        if-no-files-found: warn

    - name: 上传 deb
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: NoTodayEditBtn-deb
        path: packages/*.deb
        if-no-files-found: error
